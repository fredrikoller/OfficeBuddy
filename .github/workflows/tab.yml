name: Tab

on:
  push:
    branches: [main]
    paths:
      - "tab/**"
      - ".github/workflows/tab.yml"
  pull_request:
    paths:
      - "tab/**"
      - ".github/workflows/tab.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tab/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
